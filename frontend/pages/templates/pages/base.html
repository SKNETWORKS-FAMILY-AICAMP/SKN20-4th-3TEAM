<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DogChat - 반려견 챗봇{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <a href="{% url 'pages:home' %}">🐕 DogChat</a>
            </div>
            <ul class="navbar-menu">
                <li><a href="{% url 'pages:home' %}">홈</a></li>
                <li><a href="{% url 'pages:chat' %}">채팅</a></li>
                <li><a href="{% url 'pages:pet_settings' %}">반려견 설정</a></li>
                <li><a href="{% url 'pages:login' %}">로그인</a></li>
                <li><a href="{% url 'pages:signup' %}">회원가입</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>&copy; 2026 DogChat. 모든 권리 보유.</p>
    </footer>
</body>
</html>
