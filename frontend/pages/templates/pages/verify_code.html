{% extends 'pages/base.html' %}

{% block title %}이메일 인증 - DogChat{% endblock %}

{% block content %}
<div class="page-signup">
    <div class="signup-container">
        <h1>이메일 인증</h1>
        <p class="subtitle">{{ email }}로 발송된 인증 코드를 입력해주세요</p>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'pages:verify_code' %}" class="signup-form">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="form-group">
                <label for="code">인증 코드 (6자리)</label>
                <input type="text" id="code" name="code" placeholder="123456" 
                       maxlength="6" pattern="\d{6}" required 
                       style="text-align: center; font-size: 1.5em; letter-spacing: 5px;">
            </div>

            <button type="submit" class="btn btn-primary">인증 확인</button>
        </form>

        <form method="POST" action="{% url 'pages:resend_code' %}" style="margin-top: 15px;">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            <button type="submit" class="btn btn-secondary">인증 코드 재발송</button>
        </form>

        <div class="signup-links">
            <a href="{% url 'pages:signup' %}">처음으로 돌아가기</a>
        </div>
    </div>
</div>

<style>
    .page-signup {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
    }
    .signup-container {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 450px;
    }
    .signup-container h1 {
        text-align: center;
        margin-bottom: 15px;
        color: #333;
    }
    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 0.9em;
    }
    .messages {
        margin-bottom: 20px;
    }
    .alert {
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 10px;
    }
    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    .signup-form {
        margin-bottom: 20px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }
    .form-group input[type="text"] {
        width: 100%;
        padding: 15px;
        border: 2px solid #ddd;
        border-radius: 4px;
        font-size: 1em;
        box-sizing: border-box;
    }
    .form-group input:focus {
        outline: none;
        border-color: #2196F3;
    }
    .btn {
        width: 100%;
        padding: 12px;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .btn-primary {
        background-color: #4CAF50;
        color: white;
    }
    .btn-primary:hover {
        background-color: #45a049;
    }
    .btn-secondary {
        background-color: #757575;
        color: white;
    }
    .btn-secondary:hover {
        background-color: #616161;
    }
    .signup-links {
        text-align: center;
        font-size: 0.9em;
        color: #666;
        margin-top: 20px;
    }
    .signup-links a {
        color: #2196F3;
        text-decoration: none;
    }
    .signup-links a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
