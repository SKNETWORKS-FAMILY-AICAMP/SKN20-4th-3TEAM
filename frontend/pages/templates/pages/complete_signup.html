{% extends 'pages/base.html' %}

{% block title %}회원가입 완료 - DogChat{% endblock %}

{% block content %}
<div class="page-signup">
    <div class="signup-container">
        <h1>회원가입 완료</h1>
        <p class="subtitle">이메일 인증이 완료되었습니다. 회원 정보를 입력해주세요.</p>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'pages:complete_signup' %}" class="signup-form">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="form-group">
                <label for="email-display">이메일</label>
                <input type="email" id="email-display" value="{{ email }}" disabled 
                       style="background-color: #f5f5f5;">
            </div>

            <div class="form-group">
                <label for="username">아이디 (닉네임)</label>
                <input type="text" id="username" name="username" 
                       placeholder="사용할 아이디" required>
                <small>영문, 숫자 포함 4자 이상</small>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" 
                       placeholder="8자 이상의 비밀번호" required>
            </div>

            <div class="form-group">
                <label for="password-confirm">비밀번호 확인</label>
                <input type="password" id="password-confirm" name="password_confirm" 
                       placeholder="비밀번호 재입력" required>
            </div>

            <button type="submit" class="btn btn-primary">회원가입 완료</button>
        </form>
    </div>
</div>

<style>
    .page-signup {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
    }
    .signup-container {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 450px;
    }
    .signup-container h1 {
        text-align: center;
        margin-bottom: 15px;
        color: #333;
    }
    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 0.9em;
    }
    .messages {
        margin-bottom: 20px;
    }
    .alert {
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 10px;
    }
    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    .signup-form {
        margin-bottom: 20px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }
    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1em;
        box-sizing: border-box;
    }
    .form-group input:focus {
        outline: none;
        border-color: #2196F3;
    }
    .form-group small {
        display: block;
        color: #999;
        font-size: 0.85em;
        margin-top: 5px;
    }
    .btn {
        width: 100%;
        padding: 12px;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .btn-primary {
        background-color: #4CAF50;
        color: white;
    }
    .btn-primary:hover {
        background-color: #45a049;
    }
</style>
{% endblock %}
