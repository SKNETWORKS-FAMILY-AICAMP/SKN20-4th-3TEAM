{% extends 'pages/base.html' %}

{% block title %}비밀번호 재설정 - DogChat{% endblock %}

{% block content %}
<div class="page-reset-password">
    <div class="reset-container">
        <h1>비밀번호 재설정</h1>
        
        <form method="POST" class="reset-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">등록된 이메일</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <p class="info-text">등록된 이메일로 비밀번호 재설정 링크가 전송됩니다.</p>

            <button type="submit" class="btn btn-primary">재설정 링크 전송</button>
        </form>

        <div class="reset-links">
            <a href="{% url 'pages:login' %}">로그인으로 돌아가기</a>
        </div>
    </div>
</div>

<style>
    .page-reset-password {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
        padding: 20px;
    }
    .reset-container {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }
    .reset-container h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
    }
    .reset-form {
        margin-bottom: 20px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }
    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1em;
        box-sizing: border-box;
    }
    .info-text {
        color: #666;
        font-size: 0.9em;
        margin-bottom: 20px;
        text-align: center;
    }
    .btn {
        width: 100%;
        padding: 12px;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
    }
    .reset-links {
        text-align: center;
    }
    .reset-links a {
        color: #2196F3;
        text-decoration: none;
    }
    .reset-links a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
