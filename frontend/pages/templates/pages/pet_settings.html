{% extends 'pages/base.html' %}

{% block title %}반려견 설정 - DogChat{% endblock %}

{% block content %}
<div class="page-pet-settings">
    <div class="settings-container">
        <h1>반려견 설정</h1>
        
        <form method="POST" class="pet-form">
            {% csrf_token %}
            
            <!-- 반려견 이모티콘 -->
            <div class="form-section">
                <h2>반려견 프로필</h2>
                
                <div class="pet-icon-section">
                    <div class="pet-icon-display">🐕</div>
                    <p class="info-text">반려견 이모티콘이 표시됩니다</p>
                </div>

                <div class="form-group">
                    <label for="name">이름 *</label>
                    <input type="text" id="name" name="name" placeholder="반려견 이름" required>
                </div>
            </div>

            <!-- 반려견 정보 -->
            <div class="form-section">
                <h2>기본 정보</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="breed">종 *</label>
                        <select id="breed" name="breed" required>
                            <option value="">선택하세요</option>
                            <option value="poodle">푸들</option>
                            <option value="pomeranian">포메라니안</option>
                            <option value="labrador">라브라도</option>
                            <option value="golden">골든 리트리버</option>
                            <option value="maltese">몰티즈</option>
                            <option value="bulldog">불독</option>
                            <option value="shiba">시바견</option>
                            <option value="other">기타</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="age">나이 *</label>
                        <div class="input-with-unit">
                            <input type="number" id="age" name="age" min="0" placeholder="0" required>
                            <span class="unit">살</span>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="weight">체중 *</label>
                        <div class="input-with-unit">
                            <input type="number" id="weight" name="weight" min="0" step="0.1" placeholder="0" required>
                            <span class="unit">kg</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="gender">성별 *</label>
                        <select id="gender" name="gender" required>
                            <option value="">선택하세요</option>
                            <option value="male">수컷</option>
                            <option value="female">암컷</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 건강 정보 -->
            <div class="form-section">
                <h2>건강 정보</h2>
                
                <div class="form-group">
                    <label for="neutered">중성화 여부 *</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="neutered" value="yes" required>
                            중성화 함
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="neutered" value="no" required>
                            중성화 안 함
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="neutered" value="unknown" required>
                            모름
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="diseases">기저질환</label>
                    <textarea id="diseases" name="diseases" placeholder="있는 기저질환을 입력하세요 (예: 당뇨, 심장질환)" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="medications">복용 중인 약</label>
                    <textarea id="medications" name="medications" placeholder="현재 복용 중인 약물을 입력하세요" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="allergies">알레르기</label>
                    <textarea id="allergies" name="allergies" placeholder="음식 또는 환경 알레르기가 있으면 입력하세요" rows="3"></textarea>
                </div>
            </div>

            <!-- 버튼 -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">저장</button>
                <a href="{% url 'pages:home' %}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div>

<style>
    .page-pet-settings {
        padding: 40px 20px;
    }
    .settings-container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .settings-container h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
    }
    .form-section {
        margin-bottom: 40px;
        padding-bottom: 30px;
        border-bottom: 1px solid #eee;
    }
    .form-section:last-of-type {
        border-bottom: none;
    }
    .form-section h2 {
        font-size: 1.3em;
        margin-bottom: 20px;
        color: #333;
    }
    .pet-icon-section {
        text-align: center;
        margin-bottom: 30px;
        padding: 20px;
        background-color: #f9f9f9;
        border-radius: 8px;
    }
    .pet-icon-display {
        font-size: 5em;
        margin-bottom: 10px;
    }
    .info-text {
        color: #999;
        font-size: 0.9em;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1em;
        box-sizing: border-box;
        font-family: inherit;
    }
    .form-group textarea {
        resize: vertical;
        min-height: 80px;
    }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    .input-with-unit {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .input-with-unit input {
        flex: 1;
    }
    .unit {
        color: #666;
        font-weight: bold;
    }
    .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 10px;
    }
    .radio-label {
        display: flex;
        align-items: center;
        font-weight: normal;
        cursor: pointer;
    }
    .radio-label input[type="radio"] {
        margin-right: 8px;
        width: auto;
    }
    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
    }
    .btn {
        flex: 1;
        padding: 12px;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
    }
    .btn-primary {
        background-color: #4CAF50;
        color: white;
    }
    .btn-primary:hover {
        background-color: #45a049;
    }
    .btn-secondary {
        background-color: #999;
        color: white;
    }
    .btn-secondary:hover {
        background-color: #888;
    }

    @media (max-width: 600px) {
        .form-row {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}
