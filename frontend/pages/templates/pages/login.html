{% extends 'pages/base.html' %}

{% block title %}로그인 - DogChat{% endblock %}

{% block content %}
<div class="page-login">
    <div class="login-container">
        <h1>로그인</h1>
        
        <form method="POST" class="login-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
            </div>

            <button type="submit" class="btn btn-primary">로그인</button>
        </form>

        <div class="login-links">
            <a href="{% url 'pages:reset_password' %}">비밀번호 재설정</a>
            <span>|</span>
            <a href="{% url 'pages:signup' %}">회원가입</a>
        </div>
    </div>
</div>

<style>
    .page-login {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
        padding: 20px;
    }
    .login-container {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
    }
    .login-container h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
    }
    .login-form {
        margin-bottom: 20px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }
    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1em;
        box-sizing: border-box;
    }
    .btn {
        width: 100%;
        padding: 12px;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
    }
    .login-links {
        text-align: center;
        font-size: 0.9em;
    }
    .login-links a {
        color: #2196F3;
        text-decoration: none;
        margin: 0 10px;
    }
    .login-links a:hover {
        text-decoration: underline;
    }
    .login-links span {
        color: #ccc;
    }
</style>
{% endblock %}
