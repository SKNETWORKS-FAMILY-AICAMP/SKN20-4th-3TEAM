{% extends 'base.html' %}

{% block title %}프로필 수정{% endblock %}

{% block content %}
<div class="profile-create-container">
    <div class="profile-create-box">
        <h2>강아지 프로필 수정</h2>
        
        <form method="POST" enctype="multipart/form-data" class="profile-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">반려견 이름 *</label>
                <input type="text" id="name" name="name" required 
                       value="{{ dog.name }}"
                       placeholder="강아지 이름을 입력하세요">
            </div>

            <div class="form-group">
                <label>생년월일</label>
                <div class="date-input-group">
                    <select id="birth_year" name="birth_year">
                        <option value="">년</option>
                    </select>
                    <select id="birth_month" name="birth_month">
                        <option value="">월</option>
                    </select>
                    <select id="birth_day" name="birth_day">
                        <option value="">일</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="breed">견종</label>
                <input type="text" id="breed" name="breed" 
                       value="{{ dog.breed }}"
                       placeholder="예: 골든 리트리버, 믹스견 등">
            </div>

            <div class="form-group">
                <label>성별</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="gender" value="수컷" id="gender-male">
                        <span>수컷</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="gender" value="암컷" id="gender-female">
                        <span>암컷</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>반려견 크기</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="size" value="소형견" id="size-small">
                        <span>소형견</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="size" value="중형견" id="size-medium">
                        <span>중형견</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="size" value="대형견" id="size-large">
                        <span>대형견</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="weight">체중 (kg)</label>
                <input type="number" id="weight" name="weight" step="0.1" min="0"
                       placeholder="예: 5.5">
            </div>

            <!-- ⭐ 중성화 여부에 "모름" 추가됨 -->
            <div class="form-group">
                <label>중성화 여부</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="neutered" value="예" id="neutered-yes">
                        <span>예</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="neutered" value="아니오" id="neutered-no">
                        <span>아니오</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="neutered" value="모름" id="neutered-unknown">
                        <span>모름</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="health_info">기저 질환</label>
                <input type="text" id="health_info" name="health_info" 
                       placeholder="예: 없음, 관절염, 알레르기 등">
            </div>

            <div class="form-group">
                <label for="medication">복용약</label>
                <input type="text" id="medication" name="medication" 
                       placeholder="복용 중인 약이 있다면 입력하세요">
            </div>

            <!-- ⭐ 성격 입력 필드 제거됨 -->

            <div class="form-buttons">
                <a href="{% url 'dogs:profile_select' %}" class="btn-secondary">취소</a>
                <button type="submit" class="btn-primary">수정하기</button>
            </div>
        </form>
    </div>
</div>

<script>
// 기존 데이터 파싱
const dogData = {{ dog_data|safe }};

// 생년월일 옵션 생성
const currentYear = new Date().getFullYear();
const yearSelect = document.getElementById('birth_year');
const monthSelect = document.getElementById('birth_month');
const daySelect = document.getElementById('birth_day');

for (let year = currentYear; year >= currentYear - 20; year--) {
    const option = document.createElement('option');
    option.value = year;
    option.textContent = year + '년';
    yearSelect.appendChild(option);
}

for (let month = 1; month <= 12; month++) {
    const option = document.createElement('option');
    option.value = month;
    option.textContent = month + '월';
    monthSelect.appendChild(option);
}

for (let day = 1; day <= 31; day++) {
    const option = document.createElement('option');
    option.value = day;
    option.textContent = day + '일';
    daySelect.appendChild(option);
}

// 기존 데이터 채우기
if (dogData.birth_date) {
    const [year, month, day] = dogData.birth_date.split('-');
    yearSelect.value = year;
    monthSelect.value = parseInt(month);
    daySelect.value = parseInt(day);
}

if (dogData.gender) {
    if (dogData.gender === '수컷') {
        document.getElementById('gender-male').checked = true;
    } else {
        document.getElementById('gender-female').checked = true;
    }
}

if (dogData.size) {
    if (dogData.size === '소형견') {
        document.getElementById('size-small').checked = true;
    } else if (dogData.size === '중형견') {
        document.getElementById('size-medium').checked = true;
    } else if (dogData.size === '대형견') {
        document.getElementById('size-large').checked = true;
    }
}

if (dogData.weight) {
    document.getElementById('weight').value = dogData.weight;
}

// ⭐ 중성화 여부 - "모름" 추가
if (dogData.neutered) {
    if (dogData.neutered === '예') {
        document.getElementById('neutered-yes').checked = true;
    } else if (dogData.neutered === '아니오') {
        document.getElementById('neutered-no').checked = true;
    } else if (dogData.neutered === '모름') {
        document.getElementById('neutered-unknown').checked = true;
    }
}

if (dogData.health_info) {
    document.getElementById('health_info').value = dogData.health_info;
}

if (dogData.medication) {
    document.getElementById('medication').value = dogData.medication;
}

// ⭐ 성격 필드는 제거되었으므로 관련 코드 삭제됨
</script>
{% endblock %}
