{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강아지 채팅 - AI 수의사가 24시간 상담해드립니다</title>
    <link rel="stylesheet" href="{% static 'css/landing.css' %}">
</head>
<body>
    <div class="landing-container">
        <!-- 왼쪽: 텍스트 및 로그인/회원가입 -->
        <div class="landing-left">
            <div class="landing-content">
                <div class="logo-section">
                    <h1 class="logo">🐕 강아지 채팅</h1>
                </div>
                
                <div class="hero-text">
                    <h2 class="main-title">
                        AI 수의사가 24시간<br>
                        상담해드립니다
                    </h2>
                    <p class="sub-title">
                        강아지 건강, 이제 AI와 함께<br>
                        언제 어디서나 빠르고 정확한 상담
                    </p>
                </div>

                <div class="cta-buttons">
                    <a href="{% url 'accounts:login' %}" class="btn-landing btn-login">
                        로그인하기
                    </a>
                    <a href="{% url 'accounts:signup' %}" class="btn-landing btn-signup">
                        회원가입하기
                    </a>
                </div>

                <div class="features">
                    <div class="feature-item">
                        <span class="feature-icon">💬</span>
                        <span class="feature-text">24시간 실시간 상담</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🏥</span>
                        <span class="feature-text">전문 건강 정보</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🐾</span>
                        <span class="feature-text">맞춤형 케어</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 이미지 -->
        <div class="landing-right">
            <div class="image-container">
                <img src="{% static 'images/dog_poster.png' %}" alt="강아지 AI 상담" class="hero-image">
                <div class="floating-icon icon-1">💊</div>
                <div class="floating-icon icon-2">🩺</div>
                <div class="floating-icon icon-3">❤️</div>
                <div class="floating-icon icon-4">💬</div>
            </div>
        </div>
    </div>

    <script>
        // 떠다니는 아이콘 애니메이션
        const icons = document.querySelectorAll('.floating-icon');
        
        icons.forEach((icon, index) => {
            const duration = 3 + Math.random() * 2; // 3-5초
            const delay = index * 0.5; // 순차적 시작
            
            icon.style.animation = `float ${duration}s ease-in-out ${delay}s infinite`;
        });
    </script>
</body>
</html>
